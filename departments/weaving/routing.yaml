department: weaving

# Roles, never names, in the mapping. Departments share people constantly (one
# electrician covering three areas); hardcoding names means five files to edit when
# somebody leaves. "owner" is a reserved symbolic role used in escalation ladders — it
# resolves to the ticket's own owner_role.
#
# PILOT: one real team with one real person in it. The invented roster this file used to
# carry — Ravi, Jaspal, Harjit and five others with +9190000000x numbers — was removed
# rather than left in place, because a screen full of people who do not exist makes the
# system look configured when it is not, and every downtime report drawn from it would
# be attributed to nobody real. Add the rest as they are actually confirmed.
roles:
  engineering:
    all: [shailendra]

# Everything a role cannot resolve falls back to this person. With one team and one
# person it is the same human either way, which is the point: there is no path through
# this config that reaches nobody.
default_owner: shailendra

# Deliberately OFF. When true, every notification goes to default_owner regardless of
# which team owns the fault — which means the roster on screen decides nothing, and
# somebody reading it is being shown something untrue. Routing by team with a roster of
# one reaches exactly the same person, honestly, and starts working the moment a second
# person is added.
route_all_to_default: false

people:
  shailendra: { name: Shailendra, whatsapp: "+918696099222" }

# The shift block does double duty: it resolves who is on duty at 03:00, and it is what
# auto_classify uses to detect the changeover pattern. One source of truth for both.
shifts:
  timezone: Asia/Kolkata
  A: "06:00-14:00"
  B: "14:00-22:00"
  C: "22:00-06:00"
