department: weaving

# Timers are keyed off the reason, not a single global clock. 15 minutes is reasonable
# for an unknown stop; once the reason is "electrical fault" the useful escalation is
# against how long that repair *should* take. "owner" == the ticket's own owner_role.
#
# PILOT: every step resolves to the one engineering team, so these ladders currently
# describe how often Shailendra is told rather than who else gets pulled in. That is
# deliberate — the shape is real and starts doing more work the moment a second team
# exists, and pretending to escalate to people who do not exist yet would be theatre.
ladders:
  default:
    - { after_minutes: 0,  notify: owner }
    - { after_minutes: 30, notify: owner }
    - { after_minutes: 75, notify: owner, repeat_every_minutes: 60 }

  weaving.electrical:
    - { after_minutes: 0,  notify: owner }
    - { after_minutes: 25, notify: owner }
    - { after_minutes: 60, notify: owner, repeat_every_minutes: 60 }

  weaving.mechanical:
    - { after_minutes: 0,  notify: owner }
    - { after_minutes: 35, notify: owner }
    - { after_minutes: 90, notify: owner, repeat_every_minutes: 60 }

  # The "unknown" ladder is the entire Phase-1 WhatsApp flow expressed as configuration
  # — no separate code path. action: ask_reason sends the numbered reason prompt.
  #
  # Timings come from a day of real feed data rather than being inherited. Across looms
  # 91 and 92 the median stop that clears the 2-minute gate lasts 3-5 minutes and clears
  # itself, so asking at 15 minutes caught about 2 stops per loom per shift — fine at
  # four looms, roughly 90 messages a shift at forty-four, and nobody reads the ninetieth.
  # 20 minutes is the pilot setting. Raise it as looms come online and watch what
  # actually gets answered.
  unknown:
    - { after_minutes: 20, notify: engineering, action: ask_reason }
    - { after_minutes: 45, notify: engineering, action: ask_reason }
    - { after_minutes: 90, notify: engineering, repeat_every_minutes: 60 }

recurrence:
  window_hours: 8
  threshold: 3                    # same asset + same code
  action: skip_to_rung
  rung: 2

quiet_hours: none                 # three-shift plant, never quiet
