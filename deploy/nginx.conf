# ops-core — nginx reverse proxy.
# One TLS endpoint (WhatsApp/Chat webhooks require a valid cert), path-based routing so
# the dashboard, the API and the webhooks share one host, an auth gate on the dashboard,
# rate limiting on webhooks, and /health restricted to localhost. nginx terminates TLS
# and forwards; it holds no state and runs no business logic (design doc 4.2).

upstream ops_core { server 127.0.0.1:8000; }

# webhook rate-limit bucket
limit_req_zone $binary_remote_addr zone=hooks:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name ops.shingora.internal;

    ssl_certificate     /etc/ssl/certs/ops.crt;
    ssl_certificate_key /etc/ssl/private/ops.key;

    # Dashboard + read API — behind HTTP basic auth
    location / {
        proxy_pass http://ops_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        auth_basic "Shingora Ops";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Inbound webhooks — no basic auth (signature-verified in the app), rate limited
    location /webhook/ {
        proxy_pass http://ops_core;
        proxy_set_header Host $host;
        limit_req zone=hooks burst=20 nodelay;
    }

    # Health — liveness only, never exposed to the internet
    location = /health {
        proxy_pass http://ops_core;
        allow 127.0.0.1;
        deny all;
    }

    # --- Optional: fixes the pre-existing loom_dashboard key-in-HTML issue (doc 4.1) ---
    # Put nginx in front of the loom API so the key is injected server-side and the
    # browser never sees it. Uncomment and set the key out-of-band (not in the page).
    # location /loom/ {
    #     proxy_pass http://127.0.0.1:8081/;
    #     set $loom_key "REPLACE_WITH_LOOM_API_KEY";   # keep out of any served HTML
    #     proxy_set_header X-API-Key $loom_key;
    #     auth_basic "Shingora Ops";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    # }
}
